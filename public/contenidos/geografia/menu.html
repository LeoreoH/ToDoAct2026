<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geografía</title>
<link rel="stylesheet" href="menu.css">
</head>

<body>

<header class="materia-header">
    <button class="boton-volver" onclick="volver()">← Volver</button>
    <h1>Geografía</h1>
</header>

<main class="contenedor-materia">

    <h2>Selecciona un bloque</h2>

    <div class="contenedor-bloques">
        <button onclick="abrirModulo('la-tierra')">
            <span>Bloque I: La Tierra</span>
            <span class="descripcion-bloque">¿Dónde hace calor y frío? Mapas, coordenadas</span>
        </button>

        <button onclick="abrirModulo('componentes-naturales')">
            <span>Bloque II: Componentes naturales</span>
            <span class="descripcion-bloque">Relieve, agua, climas, regiones naturales</span>
        </button>

        <button onclick="abrirModulo('poblacion-mundial')">
            <span>Bloque III: Población mundial</span>
            <span class="descripcion-bloque">Distribución, ciudad/campo, migración, culturas</span>
        </button>
    </div>
</main>

<script src="/configClient.js"></script>
<script src="menu.js"></script>
</body>
</html>
