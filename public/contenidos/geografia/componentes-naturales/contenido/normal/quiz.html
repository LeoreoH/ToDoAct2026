<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz · Componentes Naturales · Nivel Normal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/contenidos/geografia/componentes-naturales/recursos/css/quiz-componentes.css">
</head>
<body>
  <main class="quiz-shell">
    <header class="quiz-header">
      <h1 id="quizTitle"></h1>
      <p class="quiz-sub" id="quizSubtitle"></p>
      <div class="badge-row">
        <span class="badge-pill block"><i class="fas fa-leaf"></i> Bloque II</span>
        <span class="badge-pill level" id="quizLevel"></span>
      </div>
    </header>

    <section class="screen active" id="screenStart">
      <div class="card-panel">
        <div class="hero-icon" id="startIcon"></div>
        <h2 class="hero-title" id="startTitle"></h2>
        <p class="hero-description" id="startDescription"></p>
        <div class="info-grid">
          <div class="info-card" id="infoQuestions"></div>
          <div class="info-card" id="infoPass"></div>
          <div class="info-card" id="infoPoints"></div>
        </div>
        <div class="topics-box">
          <h2>Qué se evalúa</h2>
          <ul id="topicsList"></ul>
        </div>
        <div class="center-actions">
          <button class="btn-main" onclick="ComponentesQuiz.start()">
            <i class="fas fa-play"></i>
            Comenzar quiz
          </button>
        </div>
      </div>
    </section>

    <section class="screen" id="screenQuiz">
      <div class="timer-box">
        <div class="timer-label"><i class="fas fa-stopwatch"></i> Tiempo transcurrido</div>
        <div class="timer-value" id="timerDisplay">00:00</div>
      </div>
      <div class="progress-row" id="progressRow"></div>
      <div class="question-count" id="questionCount">1/5</div>
      <div id="questionContainer"></div>
      <div class="nav-row">
        <button class="btn-nav secondary" id="btnPrev" onclick="ComponentesQuiz.prev()" disabled>
          <i class="fas fa-arrow-left"></i>
          Anterior
        </button>
        <button class="btn-nav" id="btnNext" onclick="ComponentesQuiz.next()">
          Siguiente
          <i class="fas fa-arrow-right"></i>
        </button>
        <button class="btn-nav" id="btnSubmit" onclick="ComponentesQuiz.submit()" style="display:none;">
          Enviar
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </section>

    <section class="screen" id="screenResult">
      <div class="card-panel">
        <div class="stars">
          <span class="star" id="star1">⭐</span>
          <span class="star" id="star2">⭐</span>
          <span class="star" id="star3">⭐</span>
          <span class="star" id="star4">⭐</span>
          <span class="star" id="star5">⭐</span>
        </div>
        <div class="result-emoji" id="resultEmoji">🏆</div>
        <h2 class="result-title" id="resultTitle">Resultado</h2>
        <div class="result-score" id="resultScore">0/5</div>
        <p class="result-time" id="resultTime"></p>
        <p class="result-message" id="resultMessage"></p>
        <div class="result-bar"><div class="result-fill" id="resultFill"></div></div>
        <div class="result-actions">
          <button class="btn-action btn-menu" onclick="ComponentesQuiz.goBlock()">
            <i class="fas fa-map-signs"></i>
            Volver al bloque
          </button>
          <button class="btn-action btn-next" id="btnGoNext" onclick="ComponentesQuiz.goNext()" style="display:none;">
            <span id="nextLabel"></span>
          </button>
          <button class="btn-action btn-retry" id="btnRetry" onclick="ComponentesQuiz.retry()" style="display:none;">
            <i class="fas fa-rotate-right"></i>
            Reintentar quiz
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.COMPONENTES_QUIZ_CONFIG = {
      pageTitle: 'Quiz · Componentes Naturales · Nivel Normal',
      headerTitle: 'Quiz · Componentes Naturales',
      headerSubtitle: 'Nivel normal · Agua, cuencas, ríos, lagos y obras humanas',
      levelLabel: 'Nivel normal',
      levelIcon: 'fas fa-water',
      startIcon: '💧🗺️🏞️',
      startTitle: 'Preguntas de comprensión aplicada',
      startDescription: 'Cinco preguntas enfocadas en relaciones entre procesos, usos del agua y lectura de situaciones reales.',
      topics: [
        'Evaporación y cambios de temperatura.',
        'Agua subterránea y acuíferos.',
        'Función de una cuenca hidrográfica.',
        'Uso de presas para regular agua.',
        'Diferencia entre río y lago.'
      ],
      contentId: 2,
      level: 'normal',
      minToPass: 4,
      blockMenu: '/contenidos/geografia/componentes-naturales/menu.html',
      next: {
        type: 'style',
        basePath: '../dificil/',
        label: 'Ir al nivel difícil',
        icon: 'fas fa-forward'
      },
      result: {
        successMessage: 'Lograste {pct}% de aciertos. Ya puedes continuar al nivel difícil.',
        failMessage: 'Obtuviste {pct}% de aciertos. Necesitas al menos {min} respuestas correctas para avanzar.'
      },
      questions: [
        {
          text: 'Después de varios días calurosos, los charcos y la ropa húmeda se secan con mayor rapidez. ¿Qué cambio del ciclo del agua explica mejor lo que está ocurriendo?',
          context: 'Relaciona el aumento de temperatura con el proceso del ciclo del agua que se intensifica.',
          options: ['La evaporación se acelera', 'La condensación domina durante el día', 'La infiltración se vuelve imposible', 'La precipitación aumenta automáticamente'],
          correct: 0,
          explanation: 'Cuando la temperatura aumenta, la evaporación se acelera porque más agua líquida pasa al estado de vapor.'
        },
        {
          text: 'Una comunidad se abastece con pozos que extraen agua infiltrada durante la temporada de lluvias. ¿Dónde se almacena principalmente esa reserva?',
          context: 'Piensa en el lugar donde el agua queda guardada después de filtrarse por el suelo.',
          options: ['En acuíferos del subsuelo', 'En nubes bajas cerca del terreno', 'En la desembocadura de los ríos', 'En el mar más cercano'],
          correct: 0,
          explanation: 'El agua que se infiltra puede almacenarse en acuíferos del subsuelo. De ahí se extrae con pozos o puede reaparecer en manantiales.'
        },
        {
          text: 'Después de una tormenta, varios arroyos llevan el agua hacia un mismo río principal. ¿Cómo se llama el territorio que recoge y drena toda esa agua?',
          context: 'La respuesta no es una obra humana, sino una unidad natural del relieve y del drenaje.',
          options: ['Cuenca hidrográfica', 'Canal de riego', 'Presa de contención', 'Lago artificial'],
          correct: 0,
          explanation: 'Una cuenca hidrográfica es el territorio donde el agua de lluvia escurre y se concentra hacia un río principal y sus afluentes.'
        },
        {
          text: 'Sobre un río se construye una obra para almacenar agua, regular su salida y producir electricidad. ¿De qué obra se trata?',
          context: 'La descripción se refiere a una infraestructura que modifica el curso natural del agua con fines de aprovechamiento.',
          options: ['Presa', 'Acuífero', 'Meandro', 'Estuario'],
          correct: 0,
          explanation: 'Una presa permite almacenar agua y regular su liberación. También puede utilizarse para riego, abasto y generación hidroeléctrica.'
        },
        {
          text: 'En una imagen se observa un cauce que fluye hacia el mar y, cerca, una gran masa de agua rodeada por tierra. ¿Cuál afirmación distingue mejor ambos cuerpos?',
          context: 'Debes diferenciar un cuerpo de agua en movimiento de otro que permanece acumulado.',
          options: ['El río fluye por un cauce; el lago permanece acumulado en una depresión', 'El lago siempre desemboca en el mar; el río no', 'El río siempre es salado y el lago siempre es dulce', 'No existe una diferencia importante entre ambos'],
          correct: 0,
          explanation: 'El río se desplaza por un cauce y transporta agua; el lago es una acumulación de agua rodeada por tierra en una depresión del terreno.'
        }
      ]
    };
  </script>
  <script src="/contenidos/geografia/componentes-naturales/recursos/js/quiz-componentes.js"></script>
<script src="/recursos/js/bayes-quiz-feedback.js"></script>
</body>
</html>
