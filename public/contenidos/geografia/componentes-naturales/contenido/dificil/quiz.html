<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz · Componentes Naturales · Nivel Difícil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/contenidos/geografia/componentes-naturales/recursos/css/quiz-componentes.css">
</head>
<body>
  <main class="quiz-shell">
    <header class="quiz-header">
      <h1 id="quizTitle"></h1>
      <p class="quiz-sub" id="quizSubtitle"></p>
      <div class="badge-row">
        <span class="badge-pill block"><i class="fas fa-leaf"></i> Bloque II</span>
        <span class="badge-pill level" id="quizLevel"></span>
      </div>
    </header>

    <section class="screen active" id="screenStart">
      <div class="card-panel">
        <div class="hero-icon" id="startIcon"></div>
        <h2 class="hero-title" id="startTitle"></h2>
        <p class="hero-description" id="startDescription"></p>
        <div class="info-grid">
          <div class="info-card" id="infoQuestions"></div>
          <div class="info-card" id="infoPass"></div>
          <div class="info-card" id="infoPoints"></div>
        </div>
        <div class="topics-box">
          <h2>Qué se evalúa</h2>
          <ul id="topicsList"></ul>
        </div>
        <div class="center-actions">
          <button class="btn-main" onclick="ComponentesQuiz.start()">
            <i class="fas fa-play"></i>
            Comenzar quiz
          </button>
        </div>
      </div>
    </section>

    <section class="screen" id="screenQuiz">
      <div class="timer-box">
        <div class="timer-label"><i class="fas fa-stopwatch"></i> Tiempo transcurrido</div>
        <div class="timer-value" id="timerDisplay">00:00</div>
      </div>
      <div class="progress-row" id="progressRow"></div>
      <div class="question-count" id="questionCount">1/5</div>
      <div id="questionContainer"></div>
      <div class="nav-row">
        <button class="btn-nav secondary" id="btnPrev" onclick="ComponentesQuiz.prev()" disabled>
          <i class="fas fa-arrow-left"></i>
          Anterior
        </button>
        <button class="btn-nav" id="btnNext" onclick="ComponentesQuiz.next()">
          Siguiente
          <i class="fas fa-arrow-right"></i>
        </button>
        <button class="btn-nav" id="btnSubmit" onclick="ComponentesQuiz.submit()" style="display:none;">
          Enviar
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </section>

    <section class="screen" id="screenResult">
      <div class="card-panel">
        <div class="stars">
          <span class="star" id="star1">⭐</span>
          <span class="star" id="star2">⭐</span>
          <span class="star" id="star3">⭐</span>
          <span class="star" id="star4">⭐</span>
          <span class="star" id="star5">⭐</span>
        </div>
        <div class="result-emoji" id="resultEmoji">🏆</div>
        <h2 class="result-title" id="resultTitle">Resultado</h2>
        <div class="result-score" id="resultScore">0/5</div>
        <p class="result-time" id="resultTime"></p>
        <p class="result-message" id="resultMessage"></p>
        <div class="result-bar"><div class="result-fill" id="resultFill"></div></div>
        <div class="result-actions">
          <button class="btn-action btn-menu" onclick="ComponentesQuiz.goBlock()">
            <i class="fas fa-map-signs"></i>
            Volver al bloque
          </button>
          <button class="btn-action btn-next" id="btnGoNext" onclick="ComponentesQuiz.goNext()" style="display:none;">
            <span id="nextLabel"></span>
          </button>
          <button class="btn-action btn-retry" id="btnRetry" onclick="ComponentesQuiz.retry()" style="display:none;">
            <i class="fas fa-rotate-right"></i>
            Reintentar quiz
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.COMPONENTES_QUIZ_CONFIG = {
      pageTitle: 'Quiz · Componentes Naturales · Nivel Difícil',
      headerTitle: 'Quiz · Componentes Naturales',
      headerSubtitle: 'Nivel difícil · Regiones naturales y comparación de ambientes',
      levelLabel: 'Nivel difícil',
      levelIcon: 'fas fa-crown',
      startIcon: '🌿🏜️❄️',
      startTitle: 'Síntesis de regiones naturales',
      startDescription: 'Cinco preguntas de mayor exigencia para comparar climas, vegetación y rasgos distintivos de distintas regiones naturales.',
      topics: [
        'Selva tropical y lluvias permanentes.',
        'Desierto y aridez extrema.',
        'Sabana y estación seca marcada.',
        'Tundra, permafrost y vegetación baja.',
        'Diferencia entre taiga y tundra.'
      ],
      contentId: 2,
      level: 'dificil',
      minToPass: 4,
      blockMenu: '/contenidos/geografia/componentes-naturales/menu.html',
      next: {
        type: 'url',
        url: '/contenidos/geografia/menu.html',
        label: 'Volver a Geografía',
        icon: 'fas fa-compass'
      },
      result: {
        successMessage: 'Lograste {pct}% de aciertos. Ya completaste el bloque y puedes volver al menú de Geografía.',
        failMessage: 'Obtuviste {pct}% de aciertos. Necesitas al menos {min} respuestas correctas para completar este bloque.'
      },
      questions: [
        {
          text: 'Un investigador trabaja en una región cercana al Ecuador, con lluvias durante casi todo el año y vegetación muy densa en varios estratos. ¿Qué región natural describe mejor ese paisaje?',
          context: 'No basta con pensar en calor; también importa la combinación de humedad permanente y biodiversidad alta.',
          options: ['Selva tropical', 'Sabana', 'Taiga', 'Región mediterránea'],
          correct: 0,
          explanation: 'La selva tropical combina temperaturas altas, humedad constante y lluvias abundantes durante casi todo el año, lo que favorece gran biodiversidad.'
        },
        {
          text: 'Un lugar recibe menos de 250 mm de lluvia al año, presenta vegetación escasa y registra fuertes contrastes térmicos entre día y noche. ¿Qué tipo de región es más probable?',
          context: 'La clave está en la aridez extrema y en la poca disponibilidad de agua.',
          options: ['Desierto', 'Humedal', 'Pradera templada', 'Bosque boreal'],
          correct: 0,
          explanation: 'La aridez extrema y la escasez de lluvia son rasgos centrales del desierto. Por eso la vegetación es limitada y las temperaturas suelen ser muy contrastantes.'
        },
        {
          text: 'Una región cálida pasa varios meses sin lluvias; predominan pastizales altos y árboles dispersos. ¿Qué rasgo la distingue mejor de la selva tropical?',
          context: 'Las dos regiones pueden ser cálidas, pero no comparten el mismo patrón de lluvias.',
          options: ['Tiene una estación seca bien marcada', 'Recibe lluvia durante todo el año', 'Su suelo permanece congelado', 'Está cubierta casi por completo de coníferas'],
          correct: 0,
          explanation: 'La sabana se distingue por su estación seca marcada. Esa diferencia impide el desarrollo de un bosque denso como el de la selva tropical.'
        },
        {
          text: 'En una zona muy fría, el suelo permanece congelado gran parte del año y durante el verano solo logran crecer musgos y líquenes. ¿Qué factor limita principalmente el desarrollo de árboles altos?',
          context: 'Piensa en la condición del suelo más que en la temperatura del aire solamente.',
          options: ['La presencia de permafrost', 'El exceso de lluvias tropicales', 'La cercanía al mar Mediterráneo', 'La falta de ríos superficiales'],
          correct: 0,
          explanation: 'El permafrost es un suelo permanentemente congelado que dificulta el crecimiento profundo de raíces, por eso en la tundra predominan musgos, líquenes y vegetación baja.'
        },
        {
          text: 'Dos regiones son frías: en una se extienden bosques de coníferas y en la otra casi no hay árboles porque el suelo permanece congelado. ¿Qué identificación es correcta?',
          context: 'Debes distinguir entre una región boscosa fría y otra de vegetación muy baja.',
          options: ['Taiga y tundra', 'Sabana y estepa', 'Selva y bosque templado', 'Mediterránea y humedal'],
          correct: 0,
          explanation: 'La taiga o bosque boreal se caracteriza por sus coníferas. La tundra, en cambio, casi no tiene árboles debido al frío intenso y al permafrost.'
        }
      ]
    };
  </script>
  <script src="/contenidos/geografia/componentes-naturales/recursos/js/quiz-componentes.js"></script>
<script src="/recursos/js/bayes-quiz-feedback.js"></script>
</body>
</html>
