<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz · Componentes Naturales · Nivel Fácil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/contenidos/geografia/componentes-naturales/recursos/css/quiz-componentes.css">
</head>
<body>
  <main class="quiz-shell">
    <header class="quiz-header">
      <h1 id="quizTitle"></h1>
      <p class="quiz-sub" id="quizSubtitle"></p>
      <div class="badge-row">
        <span class="badge-pill block"><i class="fas fa-leaf"></i> Bloque II</span>
        <span class="badge-pill level" id="quizLevel"></span>
      </div>
    </header>

    <section class="screen active" id="screenStart">
      <div class="card-panel">
        <div class="hero-icon" id="startIcon"></div>
        <h2 class="hero-title" id="startTitle"></h2>
        <p class="hero-description" id="startDescription"></p>
        <div class="info-grid">
          <div class="info-card" id="infoQuestions"></div>
          <div class="info-card" id="infoPass"></div>
          <div class="info-card" id="infoPoints"></div>
        </div>
        <div class="topics-box">
          <h2>Qué se evalúa</h2>
          <ul id="topicsList"></ul>
        </div>
        <div class="center-actions">
          <button class="btn-main" onclick="ComponentesQuiz.start()">
            <i class="fas fa-play"></i>
            Comenzar quiz
          </button>
        </div>
      </div>
    </section>

    <section class="screen" id="screenQuiz">
      <div class="timer-box">
        <div class="timer-label"><i class="fas fa-stopwatch"></i> Tiempo transcurrido</div>
        <div class="timer-value" id="timerDisplay">00:00</div>
      </div>
      <div class="progress-row" id="progressRow"></div>
      <div class="question-count" id="questionCount">1/5</div>
      <div id="questionContainer"></div>
      <div class="nav-row">
        <button class="btn-nav secondary" id="btnPrev" onclick="ComponentesQuiz.prev()" disabled>
          <i class="fas fa-arrow-left"></i>
          Anterior
        </button>
        <button class="btn-nav" id="btnNext" onclick="ComponentesQuiz.next()">
          Siguiente
          <i class="fas fa-arrow-right"></i>
        </button>
        <button class="btn-nav" id="btnSubmit" onclick="ComponentesQuiz.submit()" style="display:none;">
          Enviar
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </section>

    <section class="screen" id="screenResult">
      <div class="card-panel">
        <div class="stars">
          <span class="star" id="star1">⭐</span>
          <span class="star" id="star2">⭐</span>
          <span class="star" id="star3">⭐</span>
          <span class="star" id="star4">⭐</span>
          <span class="star" id="star5">⭐</span>
        </div>
        <div class="result-emoji" id="resultEmoji">🏆</div>
        <h2 class="result-title" id="resultTitle">Resultado</h2>
        <div class="result-score" id="resultScore">0/5</div>
        <p class="result-time" id="resultTime"></p>
        <p class="result-message" id="resultMessage"></p>
        <div class="result-bar"><div class="result-fill" id="resultFill"></div></div>
        <div class="result-actions">
          <button class="btn-action btn-menu" onclick="ComponentesQuiz.goBlock()">
            <i class="fas fa-map-signs"></i>
            Volver al bloque
          </button>
          <button class="btn-action btn-next" id="btnGoNext" onclick="ComponentesQuiz.goNext()" style="display:none;">
            <span id="nextLabel"></span>
          </button>
          <button class="btn-action btn-retry" id="btnRetry" onclick="ComponentesQuiz.retry()" style="display:none;">
            <i class="fas fa-rotate-right"></i>
            Reintentar quiz
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.COMPONENTES_QUIZ_CONFIG = {
      pageTitle: 'Quiz · Componentes Naturales · Nivel Fácil',
      headerTitle: 'Quiz · Componentes Naturales',
      headerSubtitle: 'Nivel fácil · Relieve, placas tectónicas, sismos y volcanes',
      levelLabel: 'Nivel fácil',
      levelIcon: 'fas fa-seedling',
      startIcon: '🌍⛰️🌋',
      startTitle: 'Repaso clave del nivel',
      startDescription: 'Cinco preguntas para comprobar comprensión real de los conceptos base del nivel fácil.',
      topics: [
        'Relieve y formas del terreno.',
        'Interacción entre placas tectónicas.',
        'Diferencia entre foco y epicentro.',
        'Magma y materiales volcánicos.',
        'Relación entre sismos, volcanes y placas.'
      ],
      contentId: 2,
      level: 'facil',
      minToPass: 4,
      blockMenu: '/contenidos/geografia/componentes-naturales/menu.html',
      next: {
        type: 'style',
        basePath: '../normal/',
        label: 'Ir al nivel normal',
        icon: 'fas fa-forward'
      },
      result: {
        successMessage: 'Lograste {pct}% de aciertos. Ya puedes continuar al nivel normal.',
        failMessage: 'Obtuviste {pct}% de aciertos. Necesitas al menos {min} respuestas correctas para avanzar.'
      },
      questions: [
        {
          text: 'Una comunidad está construida sobre una elevación amplia cuya parte superior es casi plana. No se trata de una zona baja ni de un pico agudo. ¿Qué forma del relieve describe mejor ese lugar?',
          context: 'Piensa en una forma elevada del terreno que se distingue por su cima relativamente plana.',
          options: ['Meseta', 'Valle', 'Fosa oceánica', 'Llanura costera'],
          correct: 0,
          explanation: 'La meseta es una elevación del terreno con parte superior relativamente plana. Se diferencia de la montaña, que suele presentar una cima más puntiaguda o irregular.'
        },
        {
          text: 'En el borde de dos placas tectónicas, una comienza a hundirse por debajo de la otra. ¿Qué consecuencia es más probable en esa zona?',
          context: 'Se trata de un límite convergente con subducción.',
          options: ['Formación de cordilleras y actividad volcánica', 'Desaparición total del relieve cercano', 'Congelamiento de la corteza terrestre', 'Aparición de llanuras totalmente planas'],
          correct: 0,
          explanation: 'Cuando una placa se hunde bajo otra puede producirse subducción. Ese proceso favorece la formación de cordilleras, sismos y volcanes.'
        },
        {
          text: 'Un sismo se originó a varios kilómetros de profundidad. Horas después, el reporte oficial señaló el punto de la superficie donde se sintió con mayor intensidad. ¿Cómo se llama ese punto?',
          context: 'No se pregunta por el lugar interno donde inició la ruptura, sino por su referencia en la superficie.',
          options: ['Hipocentro', 'Epicentro', 'Cráter', 'Ladera'],
          correct: 1,
          explanation: 'El epicentro es el punto de la superficie situado sobre el foco o hipocentro del sismo. Por eso suele registrarse allí el mayor impacto superficial.'
        },
        {
          text: 'En un volcán activo, el material rocoso sigue bajo la corteza y todavía no sale al exterior. ¿Cómo se llama en esa etapa?',
          context: 'La pregunta se refiere al nombre del material fundido antes de emerger por el cráter.',
          options: ['Lava', 'Magma', 'Ceniza', 'Roca sedimentaria'],
          correct: 1,
          explanation: 'Mientras permanece en el interior, ese material fundido se llama magma. Cuando sale al exterior pasa a llamarse lava.'
        },
        {
          text: 'Una misma región presenta temblores frecuentes y, además, volcanes activos cerca del límite entre placas. ¿Qué explicación relaciona mejor ambos fenómenos?',
          context: 'Busca la causa geológica que puede explicar los dos procesos al mismo tiempo.',
          options: ['La inclinación del eje terrestre fractura la corteza', 'El movimiento de placas libera energía y facilita el ascenso de magma', 'Los vientos erosionan el suelo hasta producir erupciones', 'Las lluvias intensas calientan las capas profundas del subsuelo'],
          correct: 1,
          explanation: 'El movimiento de las placas tectónicas puede acumular y liberar energía en forma de sismos y, en ciertas zonas, también facilitar el ascenso de magma que alimenta volcanes.'
        }
      ]
    };
  </script>
  <script src="/contenidos/geografia/componentes-naturales/recursos/js/quiz-componentes.js"></script>
<script src="/recursos/js/bayes-quiz-feedback.js"></script>
</body>
</html>
